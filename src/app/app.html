<aside>
    <button type ="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="primary-navigation" class="menu-toggle">{{ currentPageTitle() }}</button>
  <nav aria-label="Main navigation" id="primary-navigation" [class.open]="menuOpen()">
    <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">About Me</a>
    <a routerLink="/experience" routerLinkActive="active" ariaCurrentWhenActive="page">Experience</a>
    <a routerLink="/projects" routerLinkActive="active" ariaCurrentWhenActive="page">Projects</a>
    <a routerLink="/skills" routerLinkActive="active" ariaCurrentWhenActive="page">Skills</a>
    <a routerLink="/contact" routerLinkActive="active" ariaCurrentWhenActive="page">Contact Me</a>
  </nav>
</aside>

<main>
  <router-outlet #pageOutlet="outlet" (activate)="onPageActivated(pageOutlet)" />
</main>
